<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiStems</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaf0;--mut:#8b93a7;--acc:#6ea8ff;--ok:#4ade80;--err:#f87171}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#dfe2ea;--tx:#1b1e27;--mut:#667085;--acc:#2563eb;--ok:#15803d;--err:#b91c1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
h1{margin:0;font-size:20px}header span{color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{margin:0 0 10px;font-size:15px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
#drop.over,#drop.has{border-color:var(--acc);color:var(--tx)}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=search]{width:100%}button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.fams{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--mut);font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#models{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.m{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}.m:last-child{border:0}
.m:hover{background:rgba(110,168,255,.08)}.m.sel{background:rgba(110,168,255,.18)}
.m b{font-weight:600}.m small{display:block;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--line);color:var(--mut);margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.opts label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
.opts label.chk{flex-direction:row;align-items:center;gap:6px}
.job{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.job .top{display:flex;justify-content:space-between;gap:8px}.job .nm{font-weight:600;word-break:break-all}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.st-done{color:var(--ok)}.st-error{color:var(--err)}.msg{color:var(--mut);font-size:12px}
.stem{display:flex;align-items:center;gap:8px;margin-top:6px}.stem span{width:84px;font-weight:600}.stem audio{flex:1;height:32px;min-width:0}
.stem a{color:var(--acc);text-decoration:none;font-size:12px}
pre{white-space:pre-wrap;font-size:11px;color:var(--mut);max-height:140px;overflow:auto;margin:6px 0 0}
</style>
</head>
<body>
<header><h1>MultiStems</h1><span id="count"></span></header>
<main>
<section class="card">
  <h2>1 · Audio</h2>
  <div id="drop">Arrastra una canción aquí o haz clic para elegirla<input id="file" type="file" accept="audio/*,video/*" hidden></div>

  <h2 style="margin-top:16px">2 · Modelo</h2>
  <input id="q" type="search" placeholder="Buscar: roformer, demucs, drums, karaoke, gabox, unwa…">
  <div class="fams" id="fams"></div>
  <div id="models"></div>

  <div class="opts" id="opts">
    <label>Formato<select id="format"><option>wav</option><option>flac</option><option>mp3</option></select></label>
    <label data-for="demucs">Shifts (calidad ↑ lento ↑)<input id="shifts" type="number" min="1" max="10" value="1"></label>
    <label data-for="demucs mdxc">Overlap<input id="overlap" type="number" step="0.05" min="0.05" max="0.99" value="0.25"></label>
    <label data-for="demucs">Solo un stem (two-stems)<select id="two_stems"><option value="">No (todos)</option><option>vocals</option><option>drums</option><option>bass</option><option>other</option></select></label>
    <label data-for="asep">Solo un stem<input id="single_stem" placeholder="p.ej. Vocals"></label>
    <label class="chk" data-for="mdx"><input id="denoise" type="checkbox"> Denoise (MDX-Net)</label>
    <label class="chk" data-for="vr"><input id="tta" type="checkbox"> TTA (VR)</label>
  </div>
  <p style="margin:14px 0 0"><button class="pri" id="go" disabled>Separar stems</button> <span class="msg" id="sel">Elige un archivo y un modelo</span></p>
</section>

<section class="card">
  <h2>Trabajos</h2>
  <div id="jobs"><span class="msg">Aún no hay trabajos.</span></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
let MODELS=[],FAMS=[],fam='Todos',sel=null,file=null;

async function init(){
  const r=await (await fetch('/api/models')).json();
  MODELS=r.models;FAMS=['Todos',...r.families];
  $('#count').textContent=MODELS.length+' modelos y pipelines';
  $('#fams').innerHTML=FAMS.map(f=>`<span class="chip${f===fam?' on':''}" data-f="${f}">${f}</span>`).join('');
  render();poll();
}
$('#fams').onclick=e=>{const f=e.target.dataset.f;if(!f)return;fam=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===fam));render()};
$('#q').oninput=render;

function render(){
  const q=$('#q').value.toLowerCase().trim();
  const list=MODELS.filter(m=>(fam==='Todos'||m.family===fam)&&
    (!q||(m.name+' '+m.filename+' '+m.arch+' '+m.stems.join(' ')+' '+m.note).toLowerCase().includes(q)));
  list.sort((a,b)=>(b.sdr||0)-(a.sdr||0));
  $('#models').innerHTML=list.map(m=>`<div class="m${sel&&sel.id===m.id?' sel':''}" data-id="${m.id}">
    <b>${esc(m.name)}</b> ${m.sdr?`<span class="tag">SDR ${m.sdr}</span>`:''}<span class="tag">${esc(m.arch)}</span>
    <small>${m.stems.join(' · ')}${m.note?' — '+esc(m.note):''}</small></div>`).join('')||'<div class="m">Sin resultados</div>';
}
$('#models').onclick=e=>{const d=e.target.closest('.m');if(!d||!d.dataset.id)return;
  sel=MODELS.find(m=>m.id===d.dataset.id);render();syncOpts();check()};
function syncOpts(){
  const k=sel?(sel.engine==='demucs'?'demucs':sel.engine==='asep'?'asep '+sel.arch.toLowerCase():''):'';
  document.querySelectorAll('#opts label[data-for]').forEach(l=>{
    l.style.display=l.dataset.for.split(' ').some(t=>k.split(' ').includes(t))?'':'none'});
}
function check(){$('#go').disabled=!(file&&sel);
  $('#sel').textContent=(file?file.name:'sin archivo')+' → '+(sel?sel.name:'sin modelo')}

const drop=$('#drop'),inp=$('#file');
drop.onclick=()=>inp.click();inp.onchange=()=>setFile(inp.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
function setFile(f){if(!f)return;file=f;drop.classList.add('has');drop.firstChild.textContent='🎵 '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)';check()}

$('#go').onclick=async()=>{
  const fd=new FormData();fd.append('file',file);fd.append('model',sel.id);
  for(const k of ['format','shifts','overlap','two_stems','single_stem'])fd.append(k,$('#'+k).value);
  fd.append('denoise',$('#denoise').checked);fd.append('tta',$('#tta').checked);
  $('#go').disabled=true;
  const r=await fetch('/api/jobs',{method:'POST',body:fd});
  if(!r.ok)alert('Error: '+(await r.text()));
  $('#go').disabled=false;poll();
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let timer=null;
async function poll(){
  clearTimeout(timer);
  const jobs=await (await fetch('/api/jobs')).json();
  const open=new Set([...document.querySelectorAll('.job details[open]')].map(d=>d.closest('.job').dataset.id));
  const sig=JSON.stringify(jobs);
  if(jobs.length&&sig!==window._sig){window._sig=sig;$('#jobs').innerHTML=jobs.map(j=>{
    const m=MODELS.find(x=>x.id===j.model),active=j.status==='queued'||j.status==='running';
    const stems=Object.keys(j.files).map(s=>`<div class="stem"><span>${esc(s)}</span>
      <audio controls preload="none" src="/api/jobs/${j.id}/files/${encodeURIComponent(s)}"></audio>
      <a href="/api/jobs/${j.id}/files/${encodeURIComponent(s)}?download=true">⬇</a></div>`).join('');
    return `<div class="job" data-id="${j.id}"><div class="top"><div><div class="nm">${esc(j.filename)}</div>
      <div class="msg">${esc(m?m.name:j.model)}</div></div>
      <div><span class="st-${j.status}">${j.status}</span>
      ${active?`<button onclick="act('${j.id}','cancel')">Cancelar</button>`:`<button onclick="act('${j.id}','del')">✕</button>`}</div></div>
      ${active?`<div class="bar"><i style="width:${Math.round(j.progress*100)}%"></i></div>`:''}
      <div class="msg">${esc(j.error||j.message)}${active?' · '+Math.round(j.progress*100)+'%':''}</div>${stems}
      ${j.status==='done'?`<p style="margin:8px 0 0"><a style="color:var(--acc)" href="/api/jobs/${j.id}/zip">⬇ Descargar todo (.zip)</a></p>`:''}
      ${j.log.length?`<details${open.has(j.id)?' open':''}><summary class="msg">log</summary><pre>${esc(j.log.join('\n'))}</pre></details>`:''}</div>`}).join('');}
  if(jobs.some(j=>j.status==='queued'||j.status==='running'))timer=setTimeout(poll,1500);
}
async function act(id,a){
  await fetch('/api/jobs/'+id+(a==='cancel'?'/cancel':''),{method:a==='cancel'?'POST':'DELETE'});poll()}
init();
</script>
</body>
</html>
